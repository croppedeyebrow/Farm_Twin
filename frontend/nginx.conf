# frontend 컨테이너 내부 Nginx (정적 자산만).
# /api, /ws 프록시는 하지 않는다 — 바깥 `infra/nginx/nginx.conf` 가 담당.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Router 도입 시에도 클라이언트 라우팅이 깨지지 않게 SPA fallback
        try_files $uri /index.html;
    }
}
