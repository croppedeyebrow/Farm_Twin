# =============================================================================
# FarmTwin CI (1단계 Day 3)
# -----------------------------------------------------------------------------
# PR / main push 시:
#   1) backend  lint + test
#   2) frontend lint + build
#   3) (둘 다 성공 시) Docker 이미지 빌드 검증
#
# 인프라 설계의 "Pull Request: Python lint/type/test, TS lint/build, Docker build"
# 를 MVP 범위로 구현한 것이다. 배포 잡스는 8단계에서 추가한다.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Settings 가 import 시 DATABASE_URL 을 요구한다.
      # readiness 테스트는 engine 을 mock 하므로 실제 DB는 필요 없다.
      DATABASE_URL: postgresql+asyncpg://farmtwin:farmtwin@127.0.0.1:5432/farmtwin
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # README / .python-version 과 동일한 3.12 고정
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # README / .nvmrc 과 동일한 22 고정
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: Typecheck & build
        run: yarn build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # 단위 검증이 깨진 이미지 빌드를 돌리지 않도록 선행 잡 성공을 요구
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t farmtwin-api ./backend

      - name: Build frontend image
        run: docker build -t farmtwin-frontend ./frontend
