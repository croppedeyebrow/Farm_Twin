# =============================================================================
# FarmTwin Compose (1단계 Day 1~3)
# -----------------------------------------------------------------------------
# 목표: `docker compose up --build` 한 명령으로 전체 골격 기동
# 공개 진입점: http://127.0.0.1:8080  (nginx 만 호스트에 publish)
#
# 트래픽 흐름
#   browser → nginx:8080
#               ├─ /        → frontend:80  (정적 SPA)
#               ├─ /api/    → api:8000     (FastAPI, prefix strip)
#               └─ /ws/     → api:8000     (WebSocket Upgrade)
#   api / simulator(이후) → db:5432
#
# 런타임 핀: PostgreSQL 16 + PostGIS 3.4 (README / .tool-versions 참고)
# =============================================================================

services:
  # --- 데이터 계층 -----------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: farmtwin-db
    restart: unless-stopped
    environment:
      # `.env` 또는 기본값. 루트 `.env.example` 과 맞춘다.
      POSTGRES_DB: ${POSTGRES_DB:-farmtwin}
      POSTGRES_USER: ${POSTGRES_USER:-farmtwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmtwin}
      TZ: Asia/Seoul
    ports:
      # 호스트에서 Alembic/psql 할 때만 사용. 앱 컨테이너는 내부 DNS `db` 로 접속.
      - "15432:5432"
    volumes:
      - farmtwin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # api 는 db healthy 이후에만 시작 (depends_on condition)
      test: ["CMD-SHELL", "pg_isready -U farmtwin -d farmtwin"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - farmtwin

  # --- 애플리케이션 API ------------------------------------------------------
  api:
    build:
      context: ./backend
    container_name: farmtwin-api
    restart: unless-stopped
    environment:
      # 컨테이너 네트워크 안에서는 호스트명 `db`, 포트 5432
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://farmtwin:farmtwin@db:5432/farmtwin}
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    # 호스트에 API 포트를 직접 열지 않는다 — 설계상 공개는 Nginx 만.
    networks:
      - farmtwin

  # --- 프론트 정적 서버 ------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: farmtwin-frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - farmtwin

  # --- 유일한 외부 진입점 ----------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: farmtwin-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # 개발 중 conf 수정이 바로 반영되도록 바인드 마운트 (읽기 전용)
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - farmtwin

networks:
  farmtwin:
    driver: bridge

volumes:
  # DB 데이터 영속화. `docker compose down -v` 하면 초기화된다.
  farmtwin-postgres-data:
