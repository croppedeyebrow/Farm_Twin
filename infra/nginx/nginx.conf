# =============================================================================
# FarmTwin 공개 진입 Nginx (1단계 Day 3)
# -----------------------------------------------------------------------------
# 인프라 설계: "외부 공개는 Nginx만"
# browser → 이 서버(호스트 8080) → frontend / api
#
# 경로 규칙
#   /api/xxx  → http://api:8000/xxx     (trailing slash 로 prefix strip)
#   /ws/xxx   → http://api:8000/ws/xxx  (Upgrade 헤더 필수)
#   /         → frontend:80
# =============================================================================

upstream farmtwin_frontend {
    server frontend:80;
}

upstream farmtwin_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # REST API — `/api/health` 가 백엔드 `/health` 로 전달된다.
    location /api/ {
        proxy_pass http://farmtwin_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — 장시간 관제 스트림을 위해 read/send timeout 을 늘린다.
    location /ws/ {
        proxy_pass http://farmtwin_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA / 정적 UI
    location / {
        proxy_pass http://farmtwin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
